<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Clientes — Plataforma Tech</title>
  <meta name="description" content="Accede a tu portal de clientes para gestionar tickets, cotizaciones y más." />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: var(--primary); border-radius: 50%;
      animation: float linear infinite; opacity: 0.4;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
    .grid-lines {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(22,119,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,119,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
    .feature-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: var(--text-secondary);
    }
    .feature-item span { font-size: 16px; }
    .divider { height: 1px; background: var(--border); margin: 22px 0; }
    .link-forgot { font-size: 12.5px; color: var(--text-secondary); float: right; margin-top: -12px; }
    .link-forgot:hover { color: var(--accent); }
    #login-btn { width: 100%; margin-top: 6px; justify-content: center; padding: 12px; font-size: 15px; }
    .error-msg {
      color: var(--danger); font-size: 12.5px; display: none;
      background: rgba(255,77,106,0.08); border: 1px solid rgba(255,77,106,0.2);
      padding: 9px 14px; border-radius: var(--radius-sm); margin-bottom: 12px;
    }
    .badge-version {
      display: inline-block; padding: 3px 10px; background: rgba(22,119,255,0.12);
      color: var(--primary); border-radius: 20px; font-size: 11px; font-weight: 600;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="particles" id="particles"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">🖥️</div>
        <div class="badge-version">v2.0</div>
        <h1>Portal Clientes</h1>
        <p>Gestiona tus servicios de tecnología</p>
      </div>

      <div class="error-msg" id="error-msg">⚠️ <span id="error-text"></span></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" class="form-control" placeholder="tu@empresa.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          <a href="#" class="link-forgot">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span id="btn-text">Iniciar Sesión</span>
          <span id="btn-spin" style="display:none">⏳</span>
        </button>
      </form>

      <div class="divider"></div>
      <div class="features">
        <div class="feature-item"><span>🎫</span> Tickets 24/7</div>
        <div class="feature-item"><span>📄</span> Cotizaciones</div>
        <div class="feature-item"><span>🔒</span> Acceso seguro</div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script>
    // Partículas decorativas
    const pContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (10 + Math.random() * 20) + 's';
      p.style.animationDelay   = (Math.random() * 20) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
      pContainer.appendChild(p);
    }
  </script>
</body>
</html>
