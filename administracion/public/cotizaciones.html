<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotizaciones — Admin</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .cot-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .cot-info .folio { font-size: 13px; color: var(--accent); font-weight: 600; }
    .cot-info .titulo { font-size: 15px; font-weight: 600; margin: 4px 0; }
    .cot-right { text-align: right; }
    .cot-total { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; }
    
    .partida-row { display: grid; grid-template-columns: 3fr 1fr 1fr 40px; gap: 10px; margin-bottom: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon" style="background:linear-gradient(135deg,#ff6b35,#ff4d6a);">🛡️</div>
        <div class="logo-text">Panel Admin <span>Gestión Tech</span></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Principal</div>
        <a class="nav-item" href="dashboard.html"><span class="nav-icon">⊞</span> Dashboard</a>
        <a class="nav-item" href="clientes.html"><span class="nav-icon">👥</span> Clientes</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Operaciones</div>
        <a class="nav-item" href="topologia.html"><span class="nav-icon">📍</span> Topología</a>
        <a class="nav-item" href="tickets.html"><span class="nav-icon">🎫</span> Tickets</a>
        <a class="nav-item active" href="cotizaciones.html"><span class="nav-icon">📄</span> Cotizaciones</a>
        <a class="nav-item" href="equipos.html"><span class="nav-icon">🖥️</span> Equipos</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Configuración</div>
        <a class="nav-item" href="configuracion.html"><span class="nav-icon">⚙️</span> Configuración de Puertos</a>
      </div>
      <div class="sidebar-section">
        <a class="nav-item" href="#" id="logout-btn"><span class="nav-icon">🚪</span> Salir</a>
      </div>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info">
            <div class="u-name" id="user-name">Cargando...</div>
            <div class="u-role">Administrador</div>
          </div>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-title">Cotizaciones <span>Propuestas comerciales</span></div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btn-nueva-cot">+ Nueva Cotización</button>
      </div>
    </header>

    <main class="main-content">
      <div id="cotizaciones-list">
        <div class="empty-state"><div class="empty-icon">📄</div><div class="empty-text">Cargando...</div></div>
      </div>
    </main>
  </div>

  <!-- Modal Nueva Cotización -->
  <div class="modal-overlay" id="modal-cot">
    <div class="modal-box" style="width:min(700px,94vw);">
      <div class="modal-header">
        <h3 class="modal-title">Crear Cotización</h3>
        <button class="modal-close" id="close-modal-cot">✕</button>
      </div>
      <form id="form-cot">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="form-group">
            <label>Cliente</label>
            <select class="form-control" id="cot-cliente" required></select>
          </div>
          <div class="form-group">
            <label>Título del proyecto</label>
            <input type="text" class="form-control" id="cot-titulo" required />
          </div>
        </div>
        
        <div style="margin: 20px 0;">
          <label style="font-size:13px; font-weight:600; display:block; margin-bottom:10px;">Partidas</label>
          <div id="partidas-container"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-add-partida">+ Agregar Partida</button>
        </div>

        <div class="form-group">
          <label>Notas Adicionales</label>
          <textarea class="form-control" id="cot-notas" rows="2"></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-ghost" id="cancel-cot">Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear Cotización</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="js/auth.js" defer></script>
  <script src="js/cotizaciones.js" defer></script>
</body>
</html>
